- date: 2026-10-28
  headline: "<a href='/people/Jiyoon_Beak/index.html'>#Jiyun Beak</a>, <a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a>, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'Evaluating Bias in LLM-Synthetic Data across Majority and Minority Groups' at the NLP for Positive Impact workshop at EMNLP 2026."
  details: "<a href='/people/Jiyoon_Beak/index.html'>#Jiyun Beak</a>, <a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a>, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published <a href='https://openreview.net/forum?id=cqZ4Mjgq3g'>Evaluating Bias in LLM-Synthetic Data across Majority and Minority Groups on General and Stigmatized Topics: The Case of Multicultural and Monocultural Adolescents in South Korea</a> at the 5th Workshop on NLP for Positive Impact, held with EMNLP 2026 in Budapest. Using a survey that gave identical questionnaires to adolescents from multicultural and monocultural families in South Korea, the paper prompts two LLMs with personas matching each respondent to answer 77 survey questions, and finds only marginal differences in replication accuracy between minority and majority groups. Performance varies instead with whether prompts contain socially stigmatized words and with which model is used, highlighting both the potential and the limits of LLM-generated synthetic survey data."

- date: 2026-10-27
  headline: "<a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a> and <a href='/people/Seonwoo_Ahn/index.html'>#Seonwoo Ahn</a> presented 'Who Counts as “the People”?' at EMNLP 2026 and received the SAC Highlight Award!"
  details: "Congratulations to <a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a>, <a href='/people/Seonwoo_Ahn/index.html'>#Seonwoo Ahn</a>, Sunwoo Kwak, June Jeon, Jisung Yoon, and Taegyoon Kim! They presented <a href='https://aclanthology.org/2026.emnlp-main.879/'>Who Counts as “the People”? Measuring Contested Political Concepts from Political Speech using Masked Language Models</a> at EMNLP 2026 in Budapest, where the paper received the SAC Highlight Award. Treating a contested political concept as a combination of theory-based frames (Nation, Civic, and Global), the paper uses a fine-tuned political masked language model to score how U.S. presidential speeches from 1789 to 2025 use the term “the people.” The measurements agree with expert human coding about as closely as human coders agree with each other, trace historical periods such as the Civil War and the Civil Rights era, and relate to external indicators: stronger democracies show less national and more civic framing."

- date: 2026-10-01
  headline: "<a href='/people/Kyungjong_Kim/index.html'>#Kyungjong Kim</a> and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'A Call Log-Based Early Screening Model for Voice Phishing Risk Numbers' in The Journal of Police Policies (치안정책연구)."
  details: "<a href='/people/Kyungjong_Kim/index.html'>#Kyungjong Kim</a> and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published a paper in The Journal of Police Policies (치안정책연구): <a href='https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART003388803'>A Call Log-Based Early Screening Model for Voice Phishing Risk Numbers: Focusing on Police–Telecommunications Cooperation</a>. Testing detection across cumulative windows of 1 to 30 days of call logs, the paper finds that models trained for a specific window outperform one trained on the full period, that a 7–14 day window offers the most workable balance of speed and reliability, and that behavioral features such as outgoing call ratio and short-call ratio can flag risky numbers on their own. The authors propose using the model as decision support in a police–telecom workflow rather than as automatic blocking."

- date: 2026-10-01
