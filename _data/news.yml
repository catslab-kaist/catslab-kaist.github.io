- date: 2026-08-01
  headline: "<a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a>, <a href='/people/Jihyang_Cheon/index.html'>#Jihyang Cheon</a>, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> posted a new preprint: 'Who Delegates to AI? Evidence from 53,000 Agent Configurations'."
  details: "<a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a>, <a href='/people/Jihyang_Cheon/index.html'>#Jihyang Cheon</a>, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> posted a new preprint: <a href='https://arxiv.org/abs/2608.20425'>Who Delegates to AI? Evidence from 53,000 Agent Configurations</a>. Using a new Agentic Adoption Index built from 53,000 AI agent configurations, the paper finds that real-world AI delegation concentrates in mid-wage, bachelor's-level occupations rather than the jobs earlier exposure models flagged as most at risk, and that adoption still lags behind what is technically feasible."

- date: 2026-06-01
  headline: "<a href='/people/Kyungjong_Kim/index.html'>#Kyungjong Kim</a> and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'Proactive detection of voice phishing networks using call log analysis and machine learning' in Scientific Reports."
  details: "<a href='/people/Kyungjong_Kim/index.html'>#Kyungjong Kim</a> and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published a paper in Scientific Reports: <a href='https://www.nature.com/articles/s41598-026-54515-y'>Proactive detection of voice phishing networks using call log analysis and machine learning</a>. Using large-scale call log data from South Korea, the paper shows that voice phishing phone numbers have distinctive behavioral signatures, including concentrated weekday activity, shorter calls, more outgoing calls, and heavier use of MVNO lines, letting machine learning models flag them with over 95 percent accuracy."

- date: 2026-02-01
  headline: "<a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a>, <a href='/people/Suhyoung_Choi/index.html'>#Suhyoung Choi</a>, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'Greedy Leadership Roles: Why Modern Organizations Struggle to Retain Women Leaders' in Asian Journal of Business Ethics."
  details: "Minyoung Choi, <a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a>, <a href='/people/Suhyoung_Choi/index.html'>#Suhyoung Choi</a>, Eunhee Bae, Dongju Kim, Bong Gwan Jun, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published a paper in Asian Journal of Business Ethics: <a href='https://doi.org/10.1007/s13520-025-00250-y'>Greedy Leadership Roles: Why Modern Organizations Struggle to Retain Women Leaders</a>. Based on focus groups with women leaders at a South Korean engineering firm, the paper argues that leadership roles themselves, with their demand for near-constant availability, remain a structural barrier to gender diversity even as organizations reduce more overt forms of discrimination."

- date: 2025-11-01
  headline: "<a href='/people/Youjin_Hong/index.html'>#Youjin Hong</a> and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'Has higher education become more interdisciplinary?' in Humanities and Social Sciences Communications."
  details: "<a href='/people/Youjin_Hong/index.html'>#Youjin Hong</a>, Byungjun Kim, June Jeon, and <a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published a paper in Humanities and Social Sciences Communications: <a href='https://doi.org/10.1057/s41599-025-06126-7'>Has higher education become more interdisciplinary? A longitudinal analysis of syllabi using natural language processing</a>. Analyzing nearly 480,000 course syllabi from 2004 to 2019, the paper finds that disciplinary boundaries in university teaching have stayed remarkably stable despite the growing institutional rhetoric around interdisciplinary education."

- date: 2025-06-01
  headline: "<a href='/people/lanu_kim/index.html'>#Lanu Kim</a> published 'The Ethics of Generative AI in Social Science Research' in Technology in Society."
  details: "June Jeon, <a href='/people/lanu_kim/index.html'>#Lanu Kim</a>, and Jaehyuk Park published a paper in Technology in Society: <a href='https://doi.org/10.1016/j.techsoc.2025.102836'>The Ethics of Generative AI in Social Science Research: A Qualitative Approach for Institutionally Grounded AI Research Ethics</a>. Based on 17 interviews, the paper identifies three narratives researchers use to make sense of generative AI and research ethics (equalizer, meritocracy, and community), and argues that AI research ethics cannot be reduced to universal checklists: ethical dilemmas emerge not from AI's technical functions alone but from how those functions are situated within academia's institutional arrangements, calling for community engagement, education, and institutional governance alongside any technical rules."
