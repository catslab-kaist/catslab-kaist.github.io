- date: 2026-09-01
  headline: "Congratulations to <a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a> and <a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a> on their National Research Foundation of Korea PhD fellowships!"
  details: "Congratulations to <a href='/people/Myokyung_Han/index.html'>#Myokyung Han</a> and <a href='/people/Hyeongjae_Lee/index.html'>#Hyeongjae Lee</a>, who were each awarded a 2-year PhD fellowship from the National Research Foundation of Korea (2026.9-2028.8) for their proposals, 'Reconfiguring the Scope of Knowledge Formation through Changing Interaction Patterns in the Generative AI Era: A Focus on Online Knowledge-Formation Communities' (Myokyung Han) and 'The Labor Market Wage Premium Effect of Interdisciplinarity in Higher Education: A Study Using Syllabus Text Data and LLM Analysis' (Hyeongjae Lee)!"

